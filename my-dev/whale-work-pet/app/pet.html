<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>鲸鱼娘工作台</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    /* The window is click-through except where the artwork opts in. */
    pointer-events: none;
  }
  #root {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding-bottom: 8px;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
    pointer-events: auto;
    cursor: grab;
    filter: drop-shadow(0 10px 20px rgba(4, 10, 22, .35));
  }
  #stage:active { cursor: grabbing; }
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
  }
  video.front { opacity: 1; }
  #pill {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(22, 30, 44, .92);
    color: #eef2f8;
    font-size: 11px;
    line-height: 16px;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(4, 10, 22, .3);
    backdrop-filter: blur(8px);
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5b6b85;
  }
  #root[data-phase="working"] .dot { background: #4d7cff; }
  #root[data-phase="waiting"] .dot { background: #e0a33c; }
  #root[data-phase="done"] .dot { background: #39b57a; }
  #root[data-phase="offline"] .dot { background: #df5d5d; }
</style>
</head>
<body>
  <div id="root" data-phase="unknown">
    <div id="pill"><span class="dot"></span><span id="label">正在连接宿主</span></div>
    <div id="stage">
      <video id="a" muted loop autoplay playsinline preload="auto"></video>
      <video id="b" muted loop autoplay playsinline preload="auto"></video>
    </div>
  </div>
<script>
  const SIZE = Number(new URLSearchParams(location.search).get('size')) || 200
  const stage = document.getElementById('stage')
  const root = document.getElementById('root')
  const label = document.getElementById('label')
  const videos = [document.getElementById('a'), document.getElementById('b')]

  stage.style.width = SIZE + 'px'
  stage.style.height = SIZE + 'px'

  const COPY = {
    'phase.unknown': '正在连接宿主',
    'phase.idle': '空闲',
    'phase.working': '工作中',
    'phase.waiting': '等你确认',
    'phase.done': '干完了',
    'phase.subagent': '派了小助手',
    'phase.error': '出错了',
    'phase.offline': '宿主无响应',
  }

  const CLIPS = {
    unknown: ['idle.webm'],
    idle: ['idle.webm'],
    working: ['working.webm', 'slack.webm', 'thinking.webm'],
    waiting: ['waiting.webm'],
    done: ['done.webm'],
    subagent: ['thinking.webm'],
    error: ['error.webm'],
    offline: ['sleep.webm'],
  }

  const WORK_ROTATION_MS = 10500
  const WAITING_ESCALATE_MS = 45000
  /** Idle this long and she lies down instead of standing there. */
  const IDLE_NAP_MS = 3 * 60 * 1000
  /** A turn this long earns an occasional look at the clock. */
  const LONG_TASK_MS = 10 * 60 * 1000

  /** Click reactions, cycled so the same one never repeats back to back. */
  const REACTIONS = [
    { clip: 'react-shy.webm', ms: 2400 },
    { clip: 'react-pout.webm', ms: 2600 },
    { clip: 'react-happy.webm', ms: 2400 },
    { clip: 'startled.webm', ms: 2000 },
  ]
  /** Little things she does while nothing is happening. */
  const IDLE_ACTIONS = [
    { clip: 'look-around.webm', ms: 5200 },
    { clip: 'hum.webm', ms: 6400 },
    { clip: 'game.webm', ms: 7000 },
    { clip: 'rubik.webm', ms: 6400 },
    { clip: 'milk-tea.webm', ms: 5200 },
    { clip: 'snack-caught.webm', ms: 5200 },
    { clip: 'cleaning.webm', ms: 6400 },
  ]
  /** The nap runs as a three-part sequence once the idle stretches out. */
  const NAP = ['sleep-1.webm', 'sleep-2.webm', 'sleep-3.webm']

  let phase = 'unknown'
  let phaseSince = Date.now()
  let clipIndex = 0
  let front = 0
  let sources = ['idle.webm', null]
  /** A clip that owns the screen for a while: `{ clip, token }`. */
  let oneShot = null
  let reactionIndex = 0
  let nextIdleActionAt = 0

  const t = key => COPY[key] ?? key

  function wantedClip() {
    if (oneShot !== null) return oneShot.clip
    if (phase === 'waiting' && clipIndex > 0) return 'startled.webm'
    if (phase === 'idle') {
      if (Date.now() - phaseSince > IDLE_NAP_MS) return NAP[clipIndex % NAP.length]
      return 'idle.webm'
    }
    if (phase === 'working' && Date.now() - phaseSince > LONG_TASK_MS && clipIndex % 4 === 3) return 'waiting.webm'
    const clips = CLIPS[phase] ?? CLIPS.unknown
    return clips[clipIndex % clips.length]
  }

  function applyClip() {
    const wanted = wantedClip()
    const back = 1 - front
    if (sources[front] === wanted || sources[back] === wanted) return
    sources[back] = wanted
    const element = videos[back]
    element.src = '../assets/' + wanted
    element.play().catch(() => {})
    element.classList.add('front')
    videos[front].classList.remove('front')
    front = back
  }

  /**
   * Put one clip on screen for a while, then hand the stage back to the phase.
   * @param {string} clip - the animation file to play.
   * @param {number} ms - how long it owns the screen.
   * @returns {void}
   */
  function playOnce(clip, ms) {
    const token = {}
    oneShot = { clip, token }
    applyClip()
    window.setTimeout(() => {
      if (oneShot !== null && oneShot.token === token) {
        oneShot = null
        applyClip()
      }
    }, ms)
  }

  function setPhase(next) {
    if (next === phase) return
    phase = next
    phaseSince = Date.now()
    clipIndex = 0
    // A new phase cancels whatever she was doing; the phase owns the face again.
    oneShot = null
    nextIdleActionAt = Date.now() + 30000
    root.dataset.phase = phase
    label.textContent = t('phase.' + phase)
    applyClip()
  }

  window.pet.onState(next => {
    setPhase(next?.phase ?? 'unknown')
  })

  // A manual action from the tray or the right-click menu.
  window.pet.onPlay(clip => {
    playOnce(clip, 6400)
  })

  // Rotate the working clips, escalate a long wait, let the nap start, and give
  // an idle pet something to do now and then.
  setInterval(() => {
    const clips = CLIPS[phase] ?? CLIPS.unknown
    if (oneShot !== null) return
    if (phase === 'idle' && Date.now() > nextIdleActionAt && Date.now() - phaseSince < IDLE_NAP_MS) {
      const action = IDLE_ACTIONS[Math.floor(Math.random() * IDLE_ACTIONS.length)]
      nextIdleActionAt = Date.now() + 60000 + Math.random() * 90000
      playOnce(action.clip, action.ms)
      return
    }
    if (phase === 'working' && clips.length > 1) {
      clipIndex += 1
      applyClip()
    } else if (phase === 'waiting' && clipIndex === 0 && Date.now() - phaseSince > WAITING_ESCALATE_MS) {
      clipIndex = 1
      applyClip()
    } else {
      // The nap and the clock check depend on elapsed time, not on a counter.
      applyClip()
    }
  }, 1500)

  // Drag the whole window; a click gets a reaction, a double click opens the
  // desktop application. `dragged` survives until the click that follows the
  // release, so a drag never counts as a click.
  let drag = null
  let dragged = false
  stage.addEventListener('pointerdown', event => {
    if (event.button !== 0) return
    drag = { x: event.screenX, y: event.screenY }
    dragged = false
    window.pet.dragStart()
    stage.setPointerCapture(event.pointerId)
  })
  window.addEventListener('pointermove', event => {
    if (drag === null) return
    const dx = event.screenX - drag.x
    const dy = event.screenY - drag.y
    if (!dragged && Math.abs(dx) + Math.abs(dy) < 4) return
    dragged = true
    window.pet.dragMove(dx, dy)
  })
  window.addEventListener('pointerup', () => {
    if (drag === null) return
    drag = null
    window.pet.dragEnd()
  })

  stage.addEventListener('click', () => {
    if (dragged) {
      dragged = false
      return
    }
    const reaction = REACTIONS[reactionIndex % REACTIONS.length]
    reactionIndex += 1
    playOnce(reaction.clip, reaction.ms)
  })
  stage.addEventListener('dblclick', () => {
    // The second click of a double click already started a reaction; drop it.
    oneShot = null
    applyClip()
    window.pet.openApp()
  })

  for (const target of [stage, document.getElementById('pill')]) {
    target.addEventListener('contextmenu', event => {
      event.preventDefault()
      window.pet.menu()
    })
  }

  // Click-through everywhere the artwork and pill do not cover.
  window.addEventListener('mousemove', event => {
    const hit = document.elementFromPoint(event.clientX, event.clientY)
    window.pet.ignoreMouse(hit === null || hit === document.body || hit === document.documentElement)
  })

  applyClip()
</script>
</body>
</html>
